{% load static %}<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}ㅁㅁ은행{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="site-head">
    <div class="wrap head-top">
      <a class="logo" href="{% url 'index' %}">
        <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="3" fill="#fff"/>
          <rect x="5.5" y="9.5" width="8.5" height="13" fill="none" stroke="#0B1F3F" stroke-width="2.4"/>
          <rect x="18" y="9.5" width="8.5" height="13" fill="none" stroke="#0B1F3F" stroke-width="2.4"/>
        </svg>
        ㅁㅁ은행
      </a>
      <div class="head-links">
        <a href="{% url 'support' %}">고객센터</a>
        {% if request.session.user %}
        <a class="btn btn-ghost btn-small" href="{% url 'logout' %}">로그아웃</a>
        {% else %}
        <a class="btn btn-ghost btn-small" href="{% url 'login' %}">로그인</a>
        {% endif %}
      </div>
    </div>
  </header>
{% block content %}{% endblock %}
{% block script %}{% endblock %}
</body>
</html>
