{% extends "core/base.html" %}
{% block title %}로그인 | ㅁㅁ은행{% endblock %}
{% block content %}
  <main class="login">
    <section class="login-side">
      {% include "core/_seal.html" with seal_class="stamp" %}
      <p>맡긴 돈은<br>제자리에.</p>
    </section>

    <section class="login-main">
      <form class="login-form" method="post" action="{% url 'login' %}">
        <h1>인터넷뱅킹 로그인</h1>
        <p>시연용 계정으로 접속하세요.</p>
        {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
        <label class="field">아이디
          <input type="text" name="username" autocomplete="off" required>
        </label>
        <label class="field">비밀번호
          <input type="password" name="password" autocomplete="off" required>
        </label>
        <button class="btn btn-primary" type="submit">로그인</button>
        <div class="login-links">
          <a href="{% url 'support' %}">비밀번호 찾기</a>
          <a href="{% url 'index' %}">메인으로</a>
        </div>
      </form>
    </section>
  </main>
{% endblock %}
