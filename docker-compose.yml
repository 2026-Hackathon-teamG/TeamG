x-py-health: &py-health
  interval: 5s
  timeout: 3s
  retries: 20

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mikki
      POSTGRES_PASSWORD: mikki
      POSTGRES_DB: mikki
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mikki -d mikki"]
      interval: 5s
      timeout: 3s
      retries: 20

  bank:
    build: { context: ., dockerfile: bank/Dockerfile }
    env_file: .env
    ports: ["8001:8001"]
    healthcheck:
      <<: *py-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]

  # 은행 화면. 프론트 레포에서 빌드. nginx가 화면을 내보내고 /api/ 등은 bank로 넘김
  # 다른 브랜치로 띄우려면: FRONTEND_REF=feat/xxx docker compose up --build
  bank-ui:
    build: https://github.com/2026-Hackathon-teamG/frontend.git#${FRONTEND_REF:-main}:bank-ui
    ports: ["8005:8005"]
    depends_on:
      bank: { condition: service_healthy }
    healthcheck:
      <<: *py-health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8005/healthz"]

  gateway:
    build: { context: ., dockerfile: gateway/Dockerfile }
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      bank-ui: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      <<: *py-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]

  detector:
    build: { context: ., dockerfile: detector/Dockerfile }
    env_file: .env
    ports: ["8002:8002"]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      <<: *py-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz')"]

  # 관제 화면. 프론트 레포에서 빌드. 브라우저가 detector(:8002)에 직접 붙음
  ops-ui:
    build: https://github.com/2026-Hackathon-teamG/frontend.git#${FRONTEND_REF:-main}:ops-ui
    ports: ["8003:8003"]
    depends_on:
      detector: { condition: service_healthy }
    healthcheck:
      <<: *py-health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8003/healthz"]

  agent:
    build: { context: ., dockerfile: agent/Dockerfile }
    env_file: .env
    ports: ["8004:8004"]
    volumes:
      - ./agent/runs:/app/runs
    depends_on:
      gateway: { condition: service_healthy }
    healthcheck:
      <<: *py-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/healthz')"]

  # 시연 점검: docker compose run --rm rehearsal [--agent live -n 3]
  rehearsal:
    build: { context: ., dockerfile: detector/Dockerfile }
    profiles: ["tools"]
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["python", "/scripts/rehearsal.py"]
